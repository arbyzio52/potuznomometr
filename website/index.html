<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0b">
  <title>Потужнометр</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="device">
    <header class="brand"><span class="flag" aria-label="Украина"><i></i><i></i></span><span>ПОТУЖНОМЕТР</span></header>
    <div class="version">ПМ-v4.0.0 ПТЖ 100 MAX</div>

    <section class="card scale-card" aria-labelledby="scale-title">
      <div class="section-head">
        <div><h1 id="scale-title">ШКАЛА ПОТУЖНОСТИ</h1><p class="status"><span class="status-dot"></span><span id="status-text">ГОТОВ К ПРОВЕРКЕ</span></p></div>
        <span class="mood" id="mood" aria-label="Настроение">🤯</span>
      </div>
      <div class="meter-frame" role="img" aria-label="Шкала от минимума до максимума">
        <div class="meter" id="meter"></div>
      </div>
      <div class="range"><span>MIN</span><span>MAX</span></div>
    </section>

    <section class="lower">
      <div class="card readout">
        <div class="readout-head"><h2>ПОКАЗНИК<br>ПОТУЖНОСТІ</h2><span class="live"><i></i><i></i></span></div>
        <p class="units">ЕДИНИЦЫ: ПТЖ</p>
        <div class="number-frame"><output id="value">—</output></div>
        <div class="readout-foot"><span id="model">МОДЕЛЬ «ПЕРЕМОГА»</span><span class="mini-flag">🇺🇦 UA</span></div>
      </div>
      <div class="controls">
        <span class="mode-label">РЕЖИМ</span>
        <button class="check-button" id="check" type="button">ПРОВЕРИТЬ</button>
        <button class="settings-button" id="settings" type="button" aria-label="Настройки" title="О приложении">⚙</button>
      </div>
    </section>
    <p class="disclaimer">Шуточный генератор показаний. Не является измерительным прибором.</p>
  </main>
</body>
</html>
